<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustration Works</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1015;
      background-image: radial-gradient(circle at 50% 0%, #1d202b 0%, #0f1015 75%);
      color: #f4f4f6;
      min-height: 100vh;
      padding: 48px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .badge {
      display: inline-block;
      background-color: rgba(244, 114, 182, 0.14);
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.35);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 1.05rem;
    }

    section {
      margin-bottom: 56px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .section-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
    }

    .section-line {
      height: 1px;
      background-color: #272a36;
      width: 100%;
    }

    .sub-label {
      display: inline-block;
      background-color: #191b24;
      color: #d1d5db;
      border: 1px solid #2e3242;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 8px;
      margin-top: 28px;
      margin-bottom: 16px;
    }

    /* Top 4 Grid */
    .top-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 680px) {
      .top-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Standard Gallery Grid */
    .art-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .art-card {
      background-color: #161821;
      border: 1px solid #272a36;
      border-radius: 12px;
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .art-card:hover {
      transform: translateY(-4px);
      border-color: #f472b6;
      box-shadow: 0 14px 32px rgba(244, 114, 182, 0.16);
    }

    .top-grid .art-card {
      aspect-ratio: 16 / 9;
    }

    .art-grid .art-card {
      aspect-ratio: 4 / 3;
    }

    .art-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .art-card:hover img {
      transform: scale(1.03);
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
      cursor: zoom-out;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 92vh;
      border: 2px solid #2e3242;
      border-radius: 10px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">2D Art &amp; Digital Illustrations</span>
      <h1>Illustration Works</h1>
      <p class="subtitle">Click any artwork to view in full resolution.</p>
    </header>

    <!-- Top 4 Drawings (No descriptions) -->
    <section>
      <div class="section-header">
        <h2>Top 4 Drawings</h2>
        <div class="section-line"></div>
      </div>
      <div class="top-grid">
        <div class="art-card" onclick="openLightbox(this)">
          <img src="risingseven.png" alt="Top Drawing 1">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="needabitofinsanity.png" alt="Top Drawing 2">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="chromaapple.png" alt="Top Drawing 3">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="monsterrauntvalericook.png" alt="Top Drawing 4">
        </div>
      </div>
    </section>

    <!-- Deepwoken Art -->
    <section>
      <div class="section-header">
        <h2>Deepwoken Art</h2>
        <div class="section-line"></div>
      </div>
      <div class="art-grid">
        <div class="art-card" onclick="openLightbox(this)">
          <img src="grimanddex.png" alt="Grim Etude and Dex Ymara">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="deepwokenvoidwalk.png" alt="Deepwoken Voidwalk">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="wrenquulisnow.png" alt="Wren Quuli Snow">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="tabicoref.png" alt="Tabico Reference">
        </div>
      </div>

      <div class="sub-label">Commissioned Drawings</div>
      <div class="art-grid">
        <div class="art-card" onclick="openLightbox(this)">
          <img src="comissiondeepwoken.png" alt="Deepwoken Commission 1">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="wrenquuli.png" alt="Wren Quuli Commission">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="deepwokenblacktrack.png" alt="Deepwoken Blacktrack Commission">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="purplelightning.png" alt="Purple Lightning Commission">
        </div>
      </div>
    </section>

    <!-- Carp and Chroma -->
    <section>
      <div class="section-header">
        <h2>Carp and Chroma</h2>
        <div class="section-line"></div>
      </div>
      <div class="art-grid">
        <div class="art-card" onclick="openLightbox(this)">
          <img src="chromaflower.png" alt="Chroma Flower">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="carpgrassflower.png" alt="Carp Grass Flower">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="carpchromarun.png" alt="Carp and Chroma Run">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="carpchromawater.png" alt="Carp and Chroma Water">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="carpchromapuddle.png" alt="Carp and Chroma Puddle">
        </div>
      </div>
    </section>

    <!-- Commissions -->
    <section>
      <div class="section-header">
        <h2>Commissions</h2>
        <div class="section-line"></div>
      </div>
      <div class="art-grid">
        <div class="art-card" onclick="openLightbox(this)">
          <img src="robloxgalaxyswirl.png" alt="Roblox Galaxy Swirl Commission">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="royalbirdiebars.png" alt="Royal Birdie Bars Commission">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="whitewingedavatar.png" alt="White Winged Avatar Commission">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="yattachainsaw.png" alt="Yatta Chainsaw Commission">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="commision2.png" alt="Commission 2">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="commision1.png" alt="Commission 1">
        </div>
        <div class="art-card" onclick="openLightbox(this)">
          <img src="vrchatcommission.png" alt="VRChat Commission">
        </div>
      </div>
    </section>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Full resolution artwork">
  </div>

  <script>
    function openLightbox(cardElement) {
      const img = cardElement.querySelector('img');
      if (img) {
        document.getElementById('lightbox-img').src = img.src;
        document.getElementById('lightbox').classList.add('active');
      }
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>

</body>
</html>

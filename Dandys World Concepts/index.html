<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dandy's World Concept</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #13141a;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 60px 24px 90px;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    .pill-badge {
      display: inline-block;
      background-color: rgba(124, 92, 255, 0.14);
      border: 1px solid rgba(124, 92, 255, 0.45);
      color: #a892ff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    header p {
      color: #8f93a2;
      font-size: 0.95rem;
    }

    section {
      margin-bottom: 64px;
    }

    section h2 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 20px;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2rem;
      }
      .gallery-grid,
      .sticker-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
    }

    .art-card {
      background-color: #1c1e26;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .art-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 26px rgba(124, 92, 255, 0.22);
    }

    .art-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lightbox Overlay */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.75);
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      user-select: none;
    }
  </style>
</head>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged artwork">
  </div>

  <script>
    function openLightbox(card) {
      const img = card.querySelector('img');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('active');
    }

    function closeLightbox(event) {
      if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
        document.getElementById('lightbox').classList.remove('active');
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('active');
      }
    });
  </script>
